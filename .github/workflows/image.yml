name: Image

on:
  push:
    tags:
      - 'v*'

jobs:
  image:
    name: Build and publish the image (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # The commit the tag points at, not the default branch.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Strip the leading v from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shimomo/re-buji:${{ steps.version.outputs.version }}
            ghcr.io/shimomo/re-buji:latest
